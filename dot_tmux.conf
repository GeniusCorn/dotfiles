set-option -g default-shell /usr/bin/fish

# status bar
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_status_background "terminal"
set -g @catppuccin_window_left_separator "#[fg=#{E:@catppuccin_window_number_color},bg=default]#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_window_number_color}]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g window-status-separator "   "
set -g @catppuccin_window_right_separator "#[fg=#{E:@catppuccin_window_text_color},bg=default]#[none]"
set -g @catppuccin_window_current_left_separator "#[fg=#{E:@catppuccin_window_current_number_color},bg=default]#[fg=#{E:@thm_crust},bg=#{E:@catppuccin_window_current_number_color}]"
set -g @catppuccin_window_current_right_separator "#[fg=#{E:@catppuccin_window_current_text_color},bg=default]#[none]"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g status-style "bg=terminal,fg=terminal"
set -g status-left ""
set -g status-right '%H:%M'

# Fix Vim ESC delay
set -sg escape-time 100

# Increase scrollback buffer
set -g history-limit 50000 

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux

# Pi agent
set -g extended-keys on
set -g extended-keys-format csi-u
